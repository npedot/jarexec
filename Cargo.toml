[package]
name = "jarexec"
version = "0.2.0"
edition = "2024"
description = "Launcher for thin Java JARs: fetches dependencies and JRE on first run"
license = "MIT"
repository = "https://github.com/npedot/jarexec"
readme = "README.md"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fd-lock = "4.0.4"
flate2 = "1.1.10"
hex = "0.4.3"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
toml = "1.1.8"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation"] }
winreg = "0.56.0"
